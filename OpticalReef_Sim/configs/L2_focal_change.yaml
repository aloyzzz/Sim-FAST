# L2 -- 100 m sub-aperture, f/1 -> f/2 focal-length reconfiguration.
# The workhorse config: Studies A, B, D, E and part of C run off this.
meta: {name: L2_focal_change, level: L2}
geometry:
  aperture_diameter: 100.0
  module_pitch: 10.0
  central_obscuration: 0.0
  surfaces:
    initial: {kind: paraboloid, f: 100.0}
    target:  {kind: paraboloid, f: 200.0}    # rim sag change = r^2/4*(1/f0-1/f1) = 3.125 m
module: {fidelity: rigid, mass: 250.0, inertia_model: hex_plate, thickness: 0.05}
interface:
  joint_type: bushing
  k: [1.0e6, 1.0e6, 1.0e6, 1.0e5, 1.0e5, 1.0e5]
  c_ratio: 0.02
actuation:
  topology: truss_3dof_per_edge
  k: 1.0e7
  c: 1.0e4
  realization: ext_force_pair
  limits: {stroke: 0.5, rate: 0.01, force: 500.0, resolution: 1.0e-7}
  dynamics: {enabled: true, fn: 1.0, zeta: 0.7}
sensing: {suite: oracle}
control: {law: pid_decentralized, rate_hz: 1.0,
          gains: {kp: 2.0, ki: 0.05, kd: 5.0}, allocation_lambda: 1.0e-3}
maneuver: {profile: min_jerk, duration_in_periods: 2.0, input_shaping: ZVD}
disturbance: {cases: [none]}
solver: {engine: chrono, dt: 0.05, t_end: 3000.0, output_dt: 0.5, hht_alpha: -0.05}
